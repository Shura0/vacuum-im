# Vacuum-IM build (Qt 6, CMake + Ninja)
#
# See /home/shura/.opencode/plan/qt6-migration.md

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  qt6:
    name: Qt 6.8 (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtsvg qtmultimedia'
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libx11-dev libxss-dev \
            zlib1g-dev libssl-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLUGIN_adiummessagestyle=OFF

      - name: Build
        run: cmake --build build --parallel 4

      - name: Install
        run: cmake --install build --prefix "$PWD/install"
